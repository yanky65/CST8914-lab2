<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4 - JavaScript</title>
</head>

<body>
    <h1>HTML DOM Events</h1>
    <p>Trigger a function on hover or keyboard focus that will output "Hello World":</p>

    <button type="button" onmouseover="myFunction()" onfocus="myFunction()" onclick="myFunction()">Action!</button>
    <p id="demo" aria-live="polite"></p>

    <script>
        function myFunction() {
            document.getElementById("demo").textContent = "Hello World";
        }
    </script>
</body>

</html>
